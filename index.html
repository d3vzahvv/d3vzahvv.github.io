  <main class="page-shell">
    <section class="window-card page-intro">
      <div class="intro-content">
        <p class="eyebrow">CHANGXING · ZHEJIANG</p>
        <h1>公交线路</h1>
        <p>长兴公交官方线路与双向站点速查</p>
      </div>
    </section>

    <section class="window-card routes-section" aria-labelledby="routes-title">
      <div class="section-content">
        <div class="section-heading">
          <div><p class="eyebrow">OFFICIAL ROUTES</p><h2 id="routes-title">全部官方线路</h2></div>
          <span id="route-count" class="count-pill"></span>
        </div>
        <div class="search-wrap">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>

        </div>
        <div id="route-grid" class="route-grid" aria-live="polite"></div>
        <p id="empty-state" class="empty-state" hidden>没有找到匹配的线路</p>
      </div>
    </section>

    <section id="guide" class="guide-grid" aria-label="乘车指南">
      <article><span>¥</span><div><h2>统一票价</h2><p>无人售票，全程 2 元一票制</p></div></article>
      <article><span>◷</span><div><h2>运营提示</h2><p>冬令时部分线路末班时间会提前</p></div></article>
      <article><span>⌁</span><div><h2>实时公交</h2><p>请使用“长兴智慧交通”查询实时到站</p></div></article>
    </section>
